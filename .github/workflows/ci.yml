name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: docker build -t flow-module:test .
